---
services:
  mongodb:
    image: mongo:7
    restart: always
    volumes:
      - ./data/db:/data/db
      - ./config/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - backend
    env_file: .env
    security_opt:
      - apparmor=unconfined

  keyserver:
    image: ghcr.io/mailvelope/keyserver:latest
    restart: always
    depends_on:
      - mongodb
    networks:
      - proxy
      - backend
    env_file: .env
    security_opt:
      - apparmor=unconfined

  caddy:
    image: caddy:2-alpine
    restart: always
    depends_on:
      - keyserver
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy
    # Supplies KEYSERVER_ALLOWED_IPS to the Caddyfile allowlist.
    env_file: .env
    security_opt:
      - apparmor=unconfined

networks:
  backend:
  proxy:

volumes:
  caddy_data:
  caddy_config:
